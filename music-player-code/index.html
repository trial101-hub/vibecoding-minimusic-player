<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="player" aria-label="Music player">

    <div class="art">
      <img src="cover.jpg" alt="Album cover for Ember Static" width="1024" height="1024">
    </div>

    <div class="info">
      <p class="label">Now playing</p>
      <h1 class="title">Ember Static</h1>
      <p class="artist">Nathan</p>
    </div>

    <div class="progress">
      <span class="time" id="time-current">0:00</span>
      <div class="bar" id="bar" role="slider" tabindex="0"
           aria-label="Seek through track" aria-valuemin="0" aria-valuemax="0"
           aria-valuenow="0" aria-valuetext="0:00 of 0:00">
        <div class="rail"></div>
        <div class="fill" id="fill"></div>
        <div class="thumb" id="thumb"></div>
      </div>
      <span class="time" id="time-total">0:00</span>
    </div>

    <div class="controls">
      <button class="btn ghost" id="restart" type="button" aria-label="Back to start">
        <svg class="icon on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M11 6.5 5.5 10.5 11 14.5z" fill="currentColor"></path>
          <path d="M18 6.5 12.5 10.5 18 14.5z" fill="currentColor"></path>
        </svg>
      </button>

      <button class="btn play" id="play" type="button" aria-label="Play">
        <svg class="icon on" id="icon-play" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M8 5.5 19 12 8 18.5z" fill="currentColor"></path>
        </svg>
        <svg class="icon" id="icon-pause" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M8 5.5h3.2v13H8zM12.8 5.5H16v13h-3.2z" fill="currentColor"></path>
        </svg>
      </button>

      <button class="btn ghost" id="mute" type="button" aria-label="Mute">
        <svg class="icon on" id="icon-sound" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 9.5h3L11 6v12L7 14.5H4z" fill="currentColor"></path>
          <path d="M14.5 9c1.4 1.6 1.4 4.4 0 6M17.2 6.6c2.6 2.9 2.6 7.9 0 10.8"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
        </svg>
        <svg class="icon" id="icon-muted" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 9.5h3L11 6v12L7 14.5H4z" fill="currentColor"></path>
          <path d="M15 9.5 20 15M20 9.5 15 15" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
      </button>
    </div>

    <div class="volume">
      <label for="volume">Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>

    <audio id="audio" src="track.mp3" preload="metadata"></audio>
  </main>

  <script src="script.js"></script>
</body>
</html>
